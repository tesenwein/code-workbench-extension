name: Release

# Runs when develop is merged into main. Bumps the extension version,
# builds the VSIX, and publishes a GitHub Release with the VSIX attached.
# When the VSCE_PAT / OVSX_PAT secrets exist it also publishes to the VS Code
# Marketplace / Open VSX (see CONTRIBUTING.md); without them those steps skip.
# The version-bump commit is pushed with the built-in GITHUB_TOKEN, whose
# pushes do not re-trigger workflows, so there is no release loop.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version & Release
    runs-on: ubuntu-latest
    env:
      # Secrets are not readable in step `if:`, so surface them as env.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump patch version
        id: bump
        run: |
          cd packages/extension
          npm version patch --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: pnpm run dist:extension

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/extension/package.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            release/extension/*.vsix \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes

      # The GitHub VSIX keeps the `terminalDataWriteEvent` proposed API (it
      # powers the live-activity blink for sideloaded installs), but the
      # Marketplace and Open VSX reject extensions that enable proposals. The
      # store build strips it; the code already feature-detects the event.
      - name: Build store VSIX (no proposed APIs)
        if: env.VSCE_PAT != '' || env.OVSX_PAT != ''
        run: |
          cd packages/extension
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.enabledApiProposals;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npx @vscode/vsce package --no-dependencies --out "$RUNNER_TEMP/store.vsix"

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --no-dependencies --packagePath "$RUNNER_TEMP/store.vsix" --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "$RUNNER_TEMP/store.vsix" --pat "$OVSX_PAT"
