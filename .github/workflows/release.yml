name: Release

# Runs when develop is merged into main. Bumps the extension version,
# builds the VSIX, and publishes a GitHub Release with the VSIX attached.
# The `stores` job then publishes that tag to the VS Code Marketplace / Open VSX
# (publish-stores.yml; see CONTRIBUTING.md).
# The version-bump commit is pushed with the built-in GITHUB_TOKEN, whose
# pushes do not re-trigger workflows, so there is no release loop.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump patch version
        id: bump
        run: |
          cd packages/extension
          npm version patch --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: pnpm run dist:extension

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/extension/package.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            release/extension/*.vsix \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes

    outputs:
      tag: v${{ steps.bump.outputs.version }}

  # Store publishing is its own job (a reusable workflow) so a failed publish —
  # expired PAT, missing namespace — can be retried with "Re-run failed jobs"
  # WITHOUT bumping the version again, or later via publish-stores.yml's
  # workflow_dispatch with the release tag.
  stores:
    name: Publish to stores
    needs: release
    uses: ./.github/workflows/publish-stores.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
